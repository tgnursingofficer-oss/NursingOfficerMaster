<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nursing Officer Master Quiz</title>


<link rel="stylesheet" href="style.css">


<style>

body{

font-family: Arial, sans-serif;

background:#f4f8ff;

margin:0;

}


.quiz-header{

background:linear-gradient(135deg,#0066ff,#00c6ff);

color:white;

padding:25px;

text-align:center;

}



.quiz-container{

max-width:900px;

margin:25px auto;

padding:20px;

}



.card{

background:white;

border-radius:15px;

padding:20px;

box-shadow:0 5px 20px rgba(0,0,0,0.1);

margin-bottom:20px;

}



select{

width:100%;

padding:15px;

border-radius:10px;

font-size:16px;

}



.btn{

background:#0066ff;

color:white;

border:none;

padding:14px 25px;

border-radius:10px;

font-size:16px;

cursor:pointer;

margin-top:15px;

}



.btn:hover{

background:#004ecc;

}



.question-box{

background:white;

padding:20px;

border-radius:15px;

}



.question-number{

color:#0066ff;

font-weight:bold;

}



.option{

display:block;

width:100%;

padding:15px;

margin:10px 0;

border-radius:10px;

border:1px solid #ddd;

background:white;

text-align:left;

cursor:pointer;

font-size:16px;

}



.option:hover{

background:#eef5ff;

}



.correct{

background:#d4edda !important;

border-color:green;

}



.wrong{

background:#f8d7da !important;

border-color:red;

}



.rational-box{

margin-top:20px;

padding:20px;

background:#f8fbff;

border-radius:15px;

}



.meaning-box,
.answer-box,
.explanation-box{

background:white;

padding:15px;

margin:10px 0;

border-radius:10px;

}



.score-text{

font-size:40px;

font-weight:bold;

color:#0066ff;

}



.result-card{

background:white;

padding:30px;

text-align:center;

border-radius:20px;

}


.progress-card{

background:white;

padding:20px;

border-radius:15px;

}



.progress-bar{

height:20px;

background:#ddd;

border-radius:20px;

overflow:hidden;

}



#progressFill{

height:100%;

width:0%;

background:#0066ff;

}



</style>

</head>



<body>



<header class="quiz-header">

<h1>🩺 Nursing Officer Master</h1>

<h2>Premium Quiz System</h2>

<p>MHSRB Nursing Officer Preparation</p>

</header>





<div class="quiz-container">



<div class="card">


<h2>📚 Select Subject</h2>


<select id="subjectSelect">


<option value="">

-- Select Subject --

</option>


<option value="anatomy">
Anatomy
</option>


<option value="physiology">
Physiology
</option>


<option value="biochemistry">
Biochemistry
</option>


<option value="microbiology">
Microbiology
</option>


<option value="pathology">
Pathology
</option>


<option value="pharmacology">
Pharmacology
</option>


<option value="fundamentals">
Fundamentals of Nursing
</option>


<option value="medical-surgical-1">
Medical Surgical Nursing 1
</option>


<option value="medical-surgical-2">
Medical Surgical Nursing 2
</option>


<option value="child-health">
Child Health Nursing
</option>


<option value="mental-health">
Mental Health Nursing
</option>


<option value="obg">
Obstetrics & Gynecology
</option>


<option value="community-health">
Community Health Nursing
</option>


<option value="nursing-research">
Nursing Research
</option>


<option value="nursing-administration">
Nursing Administration
</option>


<option value="nursing-education">
Nursing Education
</option>


<option value="nutrition">
Nutrition
</option>


<option value="psychology">
Psychology
</option>


<option value="sociology">
Sociology
</option>


<option value="first-aid">
First Aid
</option>


<option value="national-health-programs">
National Health Programs
</option>



</select>



<button class="btn" onclick="startQuiz()">

🚀 Start Quiz

</button>


</div>





<div class="progress-card">


<h3>📊 Your Progress</h3>


<p>
Completed Quiz:
<span id="quizCount">0</span>
</p>


<p>
Correct Answers:
<span id="correctCount">0</span>
</p>



<div class="progress-bar">

<div id="progressFill"></div>

</div>


<p id="progressText">
0% Completed
</p>


</div>






<div id="quizBox">


</div>



</div>






<!-- QUIZ DATA FILES -->

<script src="data/anatomy-quiz.js"></script>

<script src="data/physiology-quiz.js"></script>

<script src="data/biochemistry-quiz.js"></script>

<script src="data/microbiology-quiz.js"></script>

<script src="data/pathology-quiz.js"></script>

<script src="data/pharmacology-quiz.js"></script>

<script src="data/fundamentals-quiz.js"></script>

<script src="data/medical-surgical-1-quiz.js"></script>

<script src="data/medical-surgical-2-quiz.js"></script>

<script src="data/child-health-quiz.js"></script>

<script src="data/mental-health-quiz.js"></script>

<script src="data/obg-quiz.js"></script>

<script src="data/community-health-quiz.js"></script>

<script src="data/nursing-research-quiz.js"></script>

<script src="data/nursing-administration-quiz.js"></script>

<script src="data/nursing-education-quiz.js"></script>

<script src="data/nutrition-quiz.js"></script>

<script src="data/psychology-quiz.js"></script>

<script src="data/sociology-quiz.js"></script>

<script src="data/first-aid-quiz.js"></script>

<script src="data/national-health-programs-quiz.js"></script>



<!-- ENGINE LAST -->

<script src="js/quiz-engine.js"></script>



</body>

</html>
